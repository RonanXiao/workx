[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[project]
name = "workx"
version = "0.1.8"
description = "Python SDK for Workx"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "RonanXiao" }]
keywords = ["workx", "sdk", "llm", "ai", "agents"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["pydantic>=2.12", "workx-cli-bin==0.0.1"]

[project.urls]
Homepage = "https://github.com/RonanXiao/workx"
Repository = "https://github.com/RonanXiao/workx"
Issues = "https://github.com/RonanXiao/workx/issues"
Documentation = "https://github.com/RonanXiao/workx/tree/main/sdk/python/docs"

[dependency-groups]
format = ["ruff>=0.15.8"]
test = [
  "pytest>=8.0",
  "datamodel-code-generator==0.31.2",
  { include-group = "format" },
]
dev = [
  { include-group = "test" },
  { include-group = "format" },
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
required-version = ">=0.15.8"
line-length = 100
extend-exclude = [
  "notebooks/**",
  "src/workx/generated/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4"]
ignore = ["E501"]
preview = true
extend-safe-fixes = ["ALL"]
unfixable = ["F841"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["E402"]
"tests/test_real_app_server_integration.py" = ["E402"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.uv]
exclude-newer = "7 days"
index-strategy = "first-index"

[tool.uv.pip]
exclude-newer = "7 days"
index-strategy = "first-index"

[tool.uv.sources]
workx-cli-bin = { path = "../python-runtime" }
