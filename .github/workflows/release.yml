name: release

# One-shot multi-platform release pipeline.
#
# Enter a version (e.g. 0.0.3) and the workflow:
#
#   1. Bumps the release version across the repo manifests with
#      `scripts/bump_release_version.py`, commits it to the current branch, and
#      creates/pushes the `rust-v<version>` tag at that commit.
#   2. Builds `workx-package-<target>.tar.gz` from that tag on a native runner
#      per platform (no cross-compilation from a single host):
#        - ubuntu-24.04   -> x86_64-unknown-linux-musl  (WSL / Linux x64)
#        - windows-latest -> x86_64-pc-windows-msvc     (Windows x64)
#        - macos-15       -> aarch64-apple-darwin       (macOS Apple Silicon)
#   3. Publishes the release with a combined `workx-package_SHA256SUMS`.
#
# Optional extra matrix rows (uncomment the matching `include` entry):
#   - linux arm64: os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl
#   - macOS Intel: os: macos-13,         target: x86_64-apple-darwin
#
# Notes:
#   - The bump commit and tag are pushed with the default GITHUB_TOKEN, which
#     does not re-trigger other workflows. If the default branch is protected,
#     provide a PAT (e.g. a RELEASE_PAT secret) and push with it instead.
#   - Rerunning the same version rebuilds from current `main` HEAD and moves the
#     tag there, so a failed or outdated run can be republished in place.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish (e.g. 0.0.3). Bumps repo manifests and tags rust-v<version>."
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump version, commit, and tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      changed: ${{ steps.resolve.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version manifests
        id: resolve
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          python3 scripts/bump_release_version.py "$version"
          if git diff --quiet; then
            changed="false"
            echo "Version $version is already committed; nothing to bump."
          else
            changed="true"
            git add -u
            git commit -m "chore: bump version to $version"
          fi
          {
            echo "version=$version"
            echo "tag=rust-v$version"
            echo "sha=$(git rev-parse HEAD)"
            echo "changed=$changed"
          } >> "$GITHUB_OUTPUT"

      - name: Push bump commit and release tag
        shell: bash
        run: |
          if [ "${{ steps.resolve.outputs.changed }}" = "true" ]; then
            git push origin HEAD:"${{ github.ref_name }}"
          fi
          git tag -f "${{ steps.resolve.outputs.tag }}" "${{ steps.resolve.outputs.sha }}"
          git push origin --force "refs/tags/${{ steps.resolve.outputs.tag }}"

  create-release:
    name: Create draft release
    needs: bump-version
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve release metadata
        id: resolve
        shell: bash
        run: |
          echo "version=${{ needs.bump-version.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ needs.bump-version.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.bump-version.outputs.tag }}"
          version="${{ needs.bump-version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --draft=true --title "Workx $version"
          else
            gh release create "$tag" \
              --draft=true \
              --title "Workx $version" \
              --notes "Preparing release $version..."
          fi

          # Drop package assets left over from previous attempts so the
          # published set always matches the current build. This must run
          # before the matrix jobs upload their fresh packages.
          for asset in $(gh release view "$tag" --json assets -q '.assets[].name'); do
            case "$asset" in
              workx-package-* | Workx-*) gh release delete-asset "$tag" "$asset" -y ;;
            esac
          done

  build-package:
    name: ${{ matrix.name }}
    needs:
      - bump-version
      - create-release
    runs-on: ${{ matrix.os }}
    env:
      WORKX_REPO_ROOT: ${{ github.workspace }}
      VERSION: ${{ needs.create-release.outputs.version }}
      TAG: ${{ needs.create-release.outputs.tag }}
      GH_REPO: ${{ github.repository }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (WSL)
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            apt: musl-tools nasm pkg-config
            python: python3
            build_musl_libcap: true
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            apt: ""
            python: python
          - name: macOS Apple Silicon
            # macos-14 ships an older Xcode whose ld cannot link the oversized
            # arm64 `workx` binary (ld: B/BL out of range); use a current image.
            os: macos-15
            target: aarch64-apple-darwin
            apt: ""
            python: python3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.bump-version.outputs.tag }}

      - name: Install Linux cross-compile dependencies
        if: matrix.apt != ''
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Build static libcap for musl bwrap
        if: matrix.build_musl_libcap
        shell: bash
        run: |
          set -euo pipefail
          # Provide Linux UAPI headers (linux/loop.h, linux/capability.h) for
          # bubblewrap; musl-gcc does not search glibc include dirs, so they
          # are listed in the libcap.pc Cflags below.
          sudo apt-get install -y linux-libc-dev
          prefix="$RUNNER_TEMP/musl-libcap"
          src="$RUNNER_TEMP/libcap"
          git clone --depth=1 https://git.kernel.org/pub/scm/libs/libcap/libcap.git "$src"
          make -C "$src/libcap" -j"$(nproc)" libcap.a CC=musl-gcc
          mkdir -p "$prefix/lib/pkgconfig" "$prefix/include/sys"
          cp "$src/libcap/libcap.a" "$prefix/lib/"
          cp "$src/libcap/include/sys/capability.h" "$prefix/include/sys/"
          cat > "$prefix/lib/pkgconfig/libcap.pc" <<EOF
          prefix=$prefix
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: libcap
          Description: libcap built with musl-gcc for the static Workx bwrap
          Version: 2.69
          Libs: -L\${libdir} -lcap
          # bubblewrap.c/network.c include Linux UAPI headers (linux/loop.h,
          # linux/capability.h), which musl-gcc does not search in /usr/include.
          # bwrap's build.rs turns every -I here into -idirafter, so list the
          # glibc/kernel header dirs after the libcap include dir.
          Cflags: -I\${includedir} -I/usr/include -I/usr/include/x86_64-linux-gnu
          EOF
          {
            echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
            echo "CC_x86_64_unknown_linux_musl=musl-gcc"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc"
          } >> "$GITHUB_ENV"

      - name: Install Rust 1.95.0
        shell: bash
        run: |
          rustup toolchain install 1.95.0
          rustup component add --toolchain 1.95.0 rust-src
          rustup target add --toolchain 1.95.0 "${{ matrix.target }}"
          rustup default 1.95.0

      - name: Build package archive
        shell: bash
        run: |
          ${{ matrix.python }} scripts/build_workx_package.py \
            --target "${{ matrix.target }}" \
            --cargo-profile release \
            --package-version "$VERSION" \
            --archive-output "$RUNNER_TEMP/workx-package-${{ matrix.target }}.tar.gz" \
            --force

      - name: Upload package asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            "$RUNNER_TEMP/workx-package-${{ matrix.target }}.tar.gz" \
            --clobber

  build-desktop:
    name: Desktop ${{ matrix.name }}
    needs:
      - bump-version
      - create-release
      # The Windows installer bundles `workx-package-x86_64-pc-windows-msvc`
      # from this release instead of rebuilding the CLI.
      - build-package
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.create-release.outputs.version }}
      TAG: ${{ needs.create-release.outputs.tag }}
      GH_REPO: ${{ github.repository }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            platform: darwin
            arch: arm64
          - name: Windows x64
            os: windows-latest
            platform: win32
            arch: x64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.bump-version.outputs.tag }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workx-desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: workx-desktop
        run: npm ci

      # Signing is optional. Import the certificate when the secret is present;
      # otherwise the build produces unsigned installers.
      - name: Import macOS signing certificate
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${MACOS_CERTIFICATE:-}" ]; then
            echo "MACOS_CERTIFICATE is not set; building an unsigned app."
            exit 0
          fi
          cert_path="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$cert_path"
          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p actions "$keychain"
          security import "$cert_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain" "$(security list-keychains -d user | tr -d '"')"
          security set-key-partition-list -S apple-tool:,apple: -k actions "$keychain"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Import Windows signing certificate
        if: matrix.platform == 'win32'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${WINDOWS_CERTIFICATE:-}" ]; then
            echo "WINDOWS_CERTIFICATE is not set; building an unsigned installer."
            exit 0
          fi
          cert_path="$RUNNER_TEMP/certificate.pfx"
          echo "$WINDOWS_CERTIFICATE" | base64 --decode > "$cert_path"
          {
            echo "WINDOWS_CERTIFICATE_FILE=$cert_path"
            echo "WINDOWS_CERTIFICATE_PASSWORD=$WINDOWS_CERTIFICATE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Unpack the CLI to bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="workx-package-x86_64-pc-windows-msvc.tar.gz"
          if [[ '${{ matrix.platform }}' == 'darwin' ]]; then
            archive="workx-package-aarch64-apple-darwin.tar.gz"
          fi
          # `tar` reads the drive letter in `$RUNNER_TEMP` as a remote host, so
          # extract there using relative paths.
          cd "$RUNNER_TEMP"
          gh release download "$TAG" --pattern "$archive" --dir .
          mkdir -p workx-cli
          tar -xzf "$archive" -C workx-cli
          echo "WORKX_CLI_PACKAGE_DIR=$RUNNER_TEMP/workx-cli" >> "$GITHUB_ENV"

      - name: Build installers
        working-directory: workx-desktop
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        run: npm run make -- --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      - name: Upload desktop assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            dmg="workx-desktop/out/make/Workx-${VERSION}-arm64.dmg"
            zip="workx-desktop/out/make/zip/darwin/arm64/Workx-darwin-arm64-${VERSION}.zip"
            test -f "$dmg"
            test -f "$zip"
            gh release upload "$TAG" "$dmg" "$zip" --clobber
          else
            setup="workx-desktop/out/make/squirrel.windows/x64/Workx-${VERSION} Setup.exe"
            test -f "$setup"
            cp "$setup" "$RUNNER_TEMP/Workx-${VERSION}-x64-Setup.exe"
            gh release upload "$TAG" "$RUNNER_TEMP/Workx-${VERSION}-x64-Setup.exe" --clobber
          fi

  finalize-release:
    name: Publish release
    needs:
      - create-release
      - build-package
      - build-desktop
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Rebuild checksums from uploaded packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          assets_dir="$(mktemp -d)"
          cd "$assets_dir"
          gh release download "$tag" --pattern 'workx-package-*.tar.gz'
          gh release download "$tag" --pattern 'Workx-*'
          sha256sum workx-package-*.tar.gz Workx-* > workx-package_SHA256SUMS
          cat workx-package_SHA256SUMS
          gh release upload "$tag" workx-package_SHA256SUMS --clobber

      - name: Flip draft to public
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          version="${{ needs.create-release.outputs.version }}"
          notes="## Workx $version

          Native prebuilt packages for Windows, WSL/Linux, and macOS:

          - Windows x86_64: \`workx-package-x86_64-pc-windows-msvc.tar.gz\`
          - WSL / Linux x86_64: \`workx-package-x86_64-unknown-linux-musl.tar.gz\`
          - macOS Apple Silicon: \`workx-package-aarch64-apple-darwin.tar.gz\`

          Desktop app installers:

          - macOS arm64: \`Workx-$version-arm64.dmg\`
          - Windows x64: \`Workx-$version-x64-Setup.exe\`

          Install the CLI on macOS with Homebrew:

          \`\`\`
          brew tap ronanxiao/workx
          brew trust ronanxiao/workx
          brew install workx
          \`\`\`

          \`workx\` lives in a third-party tap, so run \`brew tap\` and
          \`brew trust\` once before installing or upgrading.

          Install the desktop app on macOS with Homebrew:

          \`\`\`
          brew tap ronanxiao/workx
          brew trust ronanxiao/workx
          brew install --cask workx
          \`\`\`

          The cask depends on the \`workx\` formula, so it also installs the CLI.

          Install on Windows (PowerShell):

          \`\`\`
          irm https://raw.githubusercontent.com/RonanXiao/workx/main/scripts/install/install.ps1 | iex
          \`\`\`

          Install on WSL / Linux / macOS:

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/RonanXiao/workx/main/scripts/install/install.sh | sh
          \`\`\`"
          gh release edit "$tag" \
            --draft=false \
            --title "Workx $version" \
            --notes "$notes"

  # Requires HOMEBREW_TAP_TOKEN with push access to RonanXiao/homebrew-workx.
  # Without the secret this job is a no-op so releases are not blocked.
  update-homebrew:
    name: Update Homebrew tap
    needs:
      - create-release
      - finalize-release
      - build-desktop
    runs-on: ubuntu-24.04
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      VERSION: ${{ needs.create-release.outputs.version }}
      TAG: ${{ needs.create-release.outputs.tag }}
      GH_REPO: ${{ github.repository }}
      HOMEBREW_REPOSITORY: RonanXiao/homebrew-workx
      HOMEBREW_FORMULA_PATH: homebrew-workx/Formula/workx.rb
      HOMEBREW_CASK_PATH: homebrew-workx/Casks/workx.rb
    steps:
      - name: Skip Homebrew sync
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "HOMEBREW_TAP_TOKEN is not set; skipping Homebrew formula sync."

      - name: Checkout Workx release tools
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}

      - name: Checkout Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.HOMEBREW_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-workx
          ref: main

      - name: Update formula and push
        if: env.HOMEBREW_TAP_TOKEN != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          assets_dir="$(mktemp -d)"
          cd "$assets_dir"
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern 'workx-package-aarch64-apple-darwin.tar.gz'
          arm64_sha="$(sha256sum workx-package-aarch64-apple-darwin.tar.gz | awk '{print $1}')"

          curl -fsSL \
            "https://github.com/${{ github.repository }}/archive/refs/tags/$TAG.tar.gz" \
            -o source.tar.gz
          source_sha="$(sha256sum source.tar.gz | awk '{print $1}')"

          cd "$GITHUB_WORKSPACE"
          python3 scripts/update_homebrew_formula.py \
            --formula "$HOMEBREW_FORMULA_PATH" \
            --version "$VERSION" \
            --tag "$TAG" \
            --arm64-sha256 "$arm64_sha" \
            --source-sha256 "$source_sha"

          python3 scripts/update_homebrew_cask.py \
            --cask "$HOMEBREW_CASK_PATH" \
            --version "$VERSION"

          cd homebrew-workx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Homebrew formula and cask already up to date."
            exit 0
          fi
          git add Formula/workx.rb Casks/workx.rb
          git commit -m "Workx $VERSION"
          git push origin main
