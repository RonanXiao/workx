name: desktop-release

# Rebuilds only the desktop installers of an already published release and
# replaces the published assets in place.
#
# The full `release` workflow rebuilds the workx-rs CLI packages on every run,
# which is slow. Use this workflow when the desktop client changed and the CLI
# binaries that are already on the release are still current.
#
# Inputs:
#   version: released version to republish, e.g. `0.1.0` for the `rust-v0.1.0`
#     release. `workx-desktop/package.json` on the built ref must declare it.
#   ref: git ref to build the desktop client from. Defaults to the commit this
#     workflow runs on, so dispatching from `main` publishes the current desktop
#     client under the existing release version.
#
# The run:
#   1. Rebuilds `Workx-<version>-arm64.dmg` and `Workx-darwin-arm64-<version>.zip`
#      on macos-15 and `Workx-<version>-x64-Setup.exe` on windows-latest. The
#      Windows installer bundles the CLI from the release's existing
#      `workx-package-x86_64-pc-windows-msvc.tar.gz`.
#   2. Re-uploads them with `--clobber` and refreshes `workx-package_SHA256SUMS`,
#      which covers the desktop assets too.
#   3. Re-points the Homebrew cask at this version. The cask declares
#      `sha256 :no_check`, so replacing a DMG under an existing version does not
#      invalidate it. Skipped when HOMEBREW_TAP_TOKEN is not configured.
#
# The desktop build steps below mirror `build-desktop` in release.yml. Keep the
# two in sync when the packaging setup changes.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to republish, e.g. 0.1.0 (release tag rust-v0.1.0)."
        required: true
        type: string
      ref:
        description: "Git ref to build the desktop client from (defaults to this workflow's commit)."
        required: false
        type: string

concurrency:
  group: desktop-release-${{ github.event.inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.event.inputs.version }}
      BUILD_REF: ${{ github.event.inputs.ref }}
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      build_ref: ${{ steps.resolve.outputs.build_ref }}
    steps:
      - name: Resolve version, tag, and build ref
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION#rust-v}"
          tag="rust-v$version"
          build_ref="$BUILD_REF"
          if [ -z "$build_ref" ]; then
            build_ref="$GITHUB_SHA"
          fi
          gh release view "$tag" >/dev/null || {
            echo "::error::Release $tag does not exist; publish it before republishing its desktop assets."
            exit 1
          }
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "build_ref=$build_ref"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.build_ref }}

      - name: Verify the desktop version matches the release
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(python3 -c "import json; print(json.load(open('workx-desktop/package.json'))['version'])")"
          if [ "$manifest_version" != "${{ steps.resolve.outputs.version }}" ]; then
            echo "::error::workx-desktop/package.json declares $manifest_version, but the release is ${{ steps.resolve.outputs.version }}."
            exit 1
          fi

  build-desktop:
    name: Desktop ${{ matrix.name }}
    needs:
      - resolve
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      GH_REPO: ${{ github.repository }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            platform: darwin
            arch: arm64
          - name: Windows x64
            os: windows-latest
            platform: win32
            arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.build_ref }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workx-desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: workx-desktop
        run: npm ci

      # Signing is optional. Import the certificate when the secret is present;
      # otherwise the build produces unsigned installers.
      - name: Import macOS signing certificate
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${MACOS_CERTIFICATE:-}" ]; then
            echo "MACOS_CERTIFICATE is not set; building an unsigned app."
            exit 0
          fi
          cert_path="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$cert_path"
          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p actions "$keychain"
          security import "$cert_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain" "$(security list-keychains -d user | tr -d '"')"
          security set-key-partition-list -S apple-tool:,apple: -k actions "$keychain"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Import Windows signing certificate
        if: matrix.platform == 'win32'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${WINDOWS_CERTIFICATE:-}" ]; then
            echo "WINDOWS_CERTIFICATE is not set; building an unsigned installer."
            exit 0
          fi
          cert_path="$RUNNER_TEMP/certificate.pfx"
          echo "$WINDOWS_CERTIFICATE" | base64 --decode > "$cert_path"
          {
            echo "WINDOWS_CERTIFICATE_FILE=$cert_path"
            echo "WINDOWS_CERTIFICATE_PASSWORD=$WINDOWS_CERTIFICATE_PASSWORD"
          } >> "$GITHUB_ENV"

      # The Windows installer bundles the CLI so it works without a separate
      # `install.ps1` run. Reuse the package this release already publishes
      # instead of rebuilding the CLI here. macOS keeps resolving the CLI from
      # the Homebrew formula its cask depends on.
      - name: Unpack the CLI to bundle
        if: matrix.platform == 'win32'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="workx-package-x86_64-pc-windows-msvc.tar.gz"
          # `tar` reads the drive letter in `$RUNNER_TEMP` as a remote host, so
          # extract there using relative paths.
          cd "$RUNNER_TEMP"
          gh release download "$TAG" --pattern "$archive" --dir .
          mkdir -p workx-cli
          tar -xzf "$archive" -C workx-cli
          echo "WORKX_CLI_PACKAGE_DIR=$RUNNER_TEMP/workx-cli" >> "$GITHUB_ENV"

      - name: Build installers
        working-directory: workx-desktop
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        run: npm run make -- --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      - name: Replace desktop assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            dmg="workx-desktop/out/make/Workx-${VERSION}-arm64.dmg"
            zip="workx-desktop/out/make/zip/darwin/arm64/Workx-darwin-arm64-${VERSION}.zip"
            test -f "$dmg"
            test -f "$zip"
            gh release upload "$TAG" "$dmg" "$zip" --clobber
          else
            setup="workx-desktop/out/make/squirrel.windows/x64/Workx-${VERSION} Setup.exe"
            test -f "$setup"
            cp "$setup" "$RUNNER_TEMP/Workx-${VERSION}-x64-Setup.exe"
            gh release upload "$TAG" "$RUNNER_TEMP/Workx-${VERSION}-x64-Setup.exe" --clobber
          fi

  refresh-checksums:
    name: Refresh release checksums
    needs:
      - resolve
      - build-desktop
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Rebuild checksums from uploaded assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"
          assets_dir="$(mktemp -d)"
          cd "$assets_dir"
          gh release download "$tag" --pattern 'workx-package-*.tar.gz'
          gh release download "$tag" --pattern 'Workx-*'
          sha256sum workx-package-*.tar.gz Workx-* > workx-package_SHA256SUMS
          cat workx-package_SHA256SUMS
          gh release upload "$tag" workx-package_SHA256SUMS --clobber

  # Requires HOMEBREW_TAP_TOKEN with push access to RonanXiao/homebrew-workx.
  # Replacing the DMG changes its checksum, so the cask has to follow or
  # `brew install --cask workx` fails its integrity check. Without the secret
  # this job is a no-op and the cask must be updated by hand.
  update-homebrew:
    name: Update Homebrew cask
    needs:
      - resolve
      - refresh-checksums
    runs-on: ubuntu-24.04
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      VERSION: ${{ needs.resolve.outputs.version }}
      HOMEBREW_REPOSITORY: RonanXiao/homebrew-workx
      HOMEBREW_CASK_PATH: homebrew-workx/Casks/workx.rb
    steps:
      - name: Skip Homebrew sync
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "HOMEBREW_TAP_TOKEN is not set; skipping Homebrew cask sync."

      - name: Checkout Workx release tools
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Checkout Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.HOMEBREW_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-workx
          ref: main

      - name: Update cask and push
        if: env.HOMEBREW_TAP_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/update_homebrew_cask.py \
            --cask "$HOMEBREW_CASK_PATH" \
            --version "$VERSION"

          cd homebrew-workx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Homebrew cask already up to date."
            exit 0
          fi
          git add Casks/workx.rb
          git commit -m "Workx $VERSION desktop"
          git push origin main
